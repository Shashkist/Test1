<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World 🦀</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }
    .container {
      text-align: center;
      animation: fadeIn 1s ease-in;
    }
    h1 { font-size: 4rem; margin-bottom: 0.5rem; }
    p { font-size: 1.2rem; opacity: 0.7; }
    .crab { font-size: 5rem; display: block; margin-bottom: 1rem; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="crab">🦀</span>
    <h1>Hello, World!</h1>
    <p>Deployed by Crab · Shashkist/Test1</p>
  </div>
</body>
</html>
